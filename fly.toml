# Fly.io deployment (one small machine is plenty: the relay never runs the simulation).
#   fly launch --no-deploy --copy-config --name <your-app-name>
#   fly deploy
app = "miniempire"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # Rooms live in memory: keep exactly one machine running so players meet each other.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "3s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
